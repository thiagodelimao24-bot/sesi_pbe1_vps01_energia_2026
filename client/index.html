<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo de Energia</title>
</head>

<body>

    <h1>Cadastro de Consumo de Energia</h1>

    <form id="formEnergia">

        <label>Local:</label>
        <input type="text" id="local" required>

        <br><br>

        <label>Equipamento:</label>
        <input type="text" id="equipamento" required>

        <br><br>

        <label>Consumo kWh:</label>
        <input type="number" step="0.1" id="consumo_kwh" required>

        <br><br>

        <label>Mês de referência:</label>
        <input type="month" id="mes_referencia" required>

        <br><br>

        <label>Status:</label>

        <select id="status">
            <option value="Consumo normal">
                Consumo normal
            </option>

            <option value="Consumo elevado">
                Consumo elevado
            </option>
        </select>

        <br><br>

        <button type="submit">
            Cadastrar
        </button>

    </form>


    <script>

        const form = document.getElementById("formEnergia")

        form.addEventListener("submit", async (event) => {

            event.preventDefault()

            const dados = {
                local: document.getElementById("local").value,
                equipamento: document.getElementById("equipamento").value,
                consumo_kwh: Number(document.getElementById("consumo_kwh").value),
                mes_referencia: document.getElementById("mes_referencia").value,
                status: document.getElementById("status").value
            }

            const resposta = await fetch("http://localhost:3000/energia", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(dados)
            })

            if (resposta.ok) {
                alert("Equipamento cadastrado com sucesso!")
                form.reset()
            } else {
                alert("Erro ao cadastrar equipamento")
            }

        })

    </script>

</body>

</html>
